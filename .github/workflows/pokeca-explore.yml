name: pokeca-explore
on:
  push:
    branches: [claude/compassionate-hypatia-mpxv7a]
    paths: [pokeca/scripts/explore.py, .github/workflows/pokeca-explore.yml]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 pokeca/scripts/explore.py \
            https://snkrdunk.com/articles/33331/ \
            https://altema.jp/pokemoncard/card/39347 \
            https://price-base.com/useful/lugia-30th-market \
            "https://pokeca-chart.com/?s=%E3%83%AB%E3%82%AE%E3%82%A2" \
            "https://www.cardrush-pokemon.jp/product-list?keyword=%E3%83%AB%E3%82%AE%E3%82%A2+30th"
