name: pokeca-prices

on:
  schedule:
    - cron: "17 0 * * *" # 毎日 09:17 JST
  workflow_dispatch:
  push:
    # カード登録 (cards.json 更新) 時に過去分を即座に遡って記録する
    paths:
      - pokeca/cards.json
      - pokeca/scripts/**
      - .github/workflows/pokeca-prices.yml

permissions:
  contents: write

concurrency:
  group: pokeca-prices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and render charts
        run: python3 pokeca/scripts/update.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokeca/data pokeca/charts pokeca/README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "pokeca: 相場データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
